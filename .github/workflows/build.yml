name: Build WOODE VPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/woode/vpn/MainActivity.kt
          test -f app/src/main/assets/index.html

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug 2>&1 | tee build.log

      - name: Display error details
        if: failure()
        shell: bash
        run: |
          echo "===== GRADLE ERROR DETAILS ====="
          if [ -f build.log ]; then
            grep -n -B 4 -A 10 -E \
              'What went wrong:|Caused by:|Execution failed for task|Could not resolve|Could not find|e: file:|error:' \
              build.log | tail -n 150 || tail -n 100 build.log
          else
            echo "build.log was not created."
          fi
          echo "===== END ERROR DETAILS ====="

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WOODE-VPN-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/WOODE-VPN-debug.apk
          ls -lh dist/WOODE-VPN-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WOODE-VPN-APK
          path: dist/WOODE-VPN-debug.apk
          if-no-files-found: error
          retention-days: 7
